name: pages

# Strana sa ukupno.json: na svaku promenu i na sat (završen dan uđe u ukupno), ručno iz Actions.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE: https://markop-wd.github.io/daliprica

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Strana i ukupno po danima
        run: |
          mkdir site
          cp index.html sw.js site/
          if ! python3 tools/ukupno.py > site/ukupno.json; then
            echo "::warning::mikrofon nije odgovorio; ostaje objavljeno ukupno"
            curl -fsS "$SITE/ukupno.json" -o site/ukupno.json || echo '{"po_danu": {}}' > site/ukupno.json
          fi
          cat site/ukupno.json

      - name: Da li ima šta novo
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] && curl -fsS "$SITE/ukupno.json" -o live.json && cmp -s live.json site/ukupno.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: steps.diff.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
